name: Validate CodeMe

on:
  push:
    branches: [main, 'checkpoint/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AUTO_MODEL_SETUP: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install bounded repository search
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install bounded repository search
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - name: Check repository documentation and metadata
        run: python -B scripts/check_repository.py
      - name: Prepare local test output
        run: python -c "from pathlib import Path; Path('.runtime').mkdir(exist_ok=True)"
      - name: Run offline backend and packaging tests
        run: python -B -m pytest codeme_agent/tests --basetemp=.runtime/ci-tests --junitxml=.runtime/backend-results.xml -q
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.os }}-${{ matrix.python }}
          path: .runtime/backend-results.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  extension:
    name: Extension checks and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package
      # Customer ZIPs/VSIX downloads are not published by this validation job.
